<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Git 작업 노트</title>
    <link rel="stylesheet" href="git-notes.css" />
  </head>
  <body>
    <main class="note">
      <header>
        <p class="label">MY DEV NOTE / 01</p>

        <h1>Git 작업 노트</h1>
        <p
          class="note-sequence"
          aria-label="저장, 선택, 커밋 순서로 변경 내용을 기록합니다."
        >
          <span>저장</span>
          <svg
            class="flow-arrow"
            viewBox="0 0 24 16"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M2 8h19M15 2l6 6-6 6" />
          </svg>
          <span>선택</span>
          <svg
            class="flow-arrow"
            viewBox="0 0 24 16"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M2 8h19M15 2l6 6-6 6" />
          </svg>
          <span>커밋</span>
        </p>
      </header>
      <section class="concepts">
        <h2>Git과 GitHub</h2>
        <dl>
          <div>
            <dt>Git</dt>
            <dd>
              내 컴퓨터에서 파일의 변경 내용을 기록하고 이전 기록을 확인합니다.
            </dd>
          </div>
          <div>
            <dt>GitHub</dt>
            <dd>Git 저장소를 온라인에 올려 다른 사람과 공유합니다.</dd>
          </div>
        </dl>
      </section>
      <section class="workflow">
        <h2>변경 내용을 기록하는 순서</h2>
        <ol>
          <li><strong>저장</strong><span>파일에 반영</span></li>
          <li><strong>선택</strong><span>git add</span></li>
          <li><strong>커밋</strong><span>설명과 함께 기록</span></li>
        </ol>
      </section>
      <footer>작업 전후에는 git status로 현재 상태를 확인합니다.</footer>
    </main>
  </body>
</html>
